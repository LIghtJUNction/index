<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LIghtJUNction 的 GitHub 项目索引，探索工具、实验与开源项目。">
  <title>LIghtJUNction · 项目索引</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header><a class="brand" href="./">LJ<span> / INDEX</span></a><a href="https://github.com/LIghtJUNction">GitHub ↗</a></header>
  <main>
    <section class="intro"><div class="eyebrow">THE OPEN SOURCE COLLECTION</div><h1>想法，写成代码。</h1><p>LIghtJUNction 的工具、实验与开源项目。<br>持续构建，也持续分享。</p><div id="stats" class="stats">正在读取项目…</div></section>
    <section aria-label="项目索引">
      <div class="section-title"><h2>探索项目 <span id="count"></span></h2><span class="small">PUBLIC REPOSITORIES</span></div>
      <div class="controls">
        <label class="search"><span class="sr-only">搜索项目</span><input id="search" type="search" placeholder="搜索名称、描述、主题…"></label>
        <label><span class="sr-only">编程语言</span><select id="language"><option value="">所有语言</option></select></label>
        <label><span class="sr-only">排序</span><select id="sort"><option value="stars">最多 Star</option><option value="updated">最近推送</option><option value="name">名称 A–Z</option></select></label>
        <label class="toggle"><input id="forks" type="checkbox"> 包含 Fork</label>
      </div>
      <p id="status" role="status" aria-live="polite"></p><div id="projects" class="grid"></div>
      <noscript>请启用 JavaScript 查看可搜索的索引，或直接访问 <a href="https://github.com/LIghtJUNction?tab=repositories">GitHub 项目列表</a>。</noscript>
    </section>
  </main>
  <footer><span>保持好奇，持续构建。</span><span id="synced">每天自动同步 · GitHub Actions</span><a href="https://github.com/LIghtJUNction/index">索引源码 ↗</a></footer>
</body>
</html>
